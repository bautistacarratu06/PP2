<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1215" width="1420" height="1215" role="img" aria-label="GestionEscolar — arquitectura" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F766E"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #1F2937; }
      .title { font-size: 26px; font-weight: 700; fill: #134E4A; }
      .band { font-size: 16px; font-weight: 700; fill: #0F766E; }
      .bt { font-size: 14px; font-weight: 700; fill: #134E4A; }
      .l { font-size: 12.5px; }
      .m { font-family: Consolas, "Courier New", monospace; font-size: 12px; }
      .mb { font-family: Consolas, "Courier New", monospace; font-size: 13.5px; font-weight: 700; fill: #134E4A; }
      .lbl { font-size: 12px; fill: #0F766E; font-style: italic; }
      .note { font-size: 12px; fill: #6B7280; }
      .box { fill: #FFFFFF; stroke: #0F766E; stroke-width: 1.5; }
      .bandr { fill: #F0FDFA; stroke: #0F766E; stroke-width: 2; }
      .ar { fill: none; stroke: #0F766E; stroke-width: 2.2; marker-end: url(#arr); }
    </style>
  </defs>

  <rect width="1420" height="1215" fill="#FFFFFF"/>
  <text x="40" y="48" class="title">GestionEscolar — arquitectura</text>

  <!-- ============ UI ============ -->
  <rect x="40" y="80" width="960" height="270" rx="16" class="bandr"/>
  <text x="60" y="110" class="band">UI — proyecto <tspan class="mb">MAUI</tspan> de escritorio (Windows)</text>

  <rect x="60" y="130" width="290" height="200" rx="10" class="box"/>
  <text x="76" y="160" class="bt">Shell y páginas</text>
  <text x="76" y="192" class="l"><tspan class="m">AppShell</tspan> con flyout</text>
  <text x="76" y="214" class="l">Nómina · Asistencia · Entregas</text>
  <text x="76" y="236" class="l">Calendario · Seguimiento</text>
  <text x="76" y="258" class="l">Ficha del alumno · Ajustes</text>
  <text x="76" y="280" class="l">Páginas resueltas por DI</text>

  <rect x="375" y="130" width="290" height="200" rx="10" class="box"/>
  <text x="391" y="160" class="bt">ViewModels</text>
  <text x="391" y="192" class="l">Hablan solo con casos de uso de Core</text>
  <text x="391" y="214" class="l">Ningún ViewModel recibe un repositorio</text>
  <text x="391" y="236" class="l">Registrados como <tspan class="m">transient</tspan></text>

  <rect x="690" y="130" width="290" height="200" rx="10" class="box"/>
  <text x="706" y="160" class="mb">MauiProgram</text>
  <text x="706" y="182" class="l" font-style="italic">composition root</text>
  <text x="706" y="212" class="l">Llama a <tspan class="m">AddCore()</tspan> y <tspan class="m">AddData()</tspan></text>
  <text x="706" y="234" class="l">Registra ViewModels y páginas</text>
  <text x="706" y="256" class="l">como <tspan class="m">transient</tspan></text>
  <text x="706" y="278" class="l">El Shell resuelve las páginas por DI</text>

  <!-- UI -> Data (solo arranque) -->
  <path d="M830 350 L830 390" class="ar" stroke-dasharray="7 5"/>
  <text x="818" y="376" class="lbl" text-anchor="end">solo en el arranque: AddData()</text>

  <!-- UI -> Core (ruta por la derecha) -->
  <path d="M1000 215 L1030 215 L1030 810 L1002 810" class="ar"/>
  <text x="1046" y="520" class="lbl" transform="rotate(-90 1046 520)" text-anchor="middle">casos de uso</text>

  <!-- ============ DATA ============ -->
  <rect x="40" y="390" width="960" height="200" rx="16" class="bandr"/>
  <text x="60" y="418" class="band">Data — acceso a <tspan class="mb">SQL Server</tspan></text>

  <rect x="60" y="435" width="450" height="135" rx="10" class="box"/>
  <text x="76" y="463" class="bt">Repositorios SQL</text>
  <text x="76" y="489" class="l">Implementan las interfaces de repositorio de Core</text>
  <text x="76" y="511" class="l"><tspan class="m">SqlCommand</tspan> parametrizado y <tspan class="m">CancellationToken</tspan></text>
  <text x="76" y="533" class="l">Registrados como <tspan class="m">singleton</tspan> en <tspan class="m">AddData()</tspan></text>

  <rect x="535" y="435" width="445" height="135" rx="10" class="box"/>
  <text x="551" y="463" class="mb">DatabaseOptions</text>
  <text x="551" y="489" class="l">Transporta la connection string</text>
  <text x="551" y="511" class="l">Leída de la configuración de la app (<tspan class="m">appsettings</tspan>)</text>
  <text x="551" y="533" class="l">Desarrollo: <tspan class="m">.\SQLEXPRESS</tspan> · <tspan class="m">course_tracking</tspan></text>
  <text x="551" y="555" class="l">Conexión de confianza</text>

  <!-- Data -> SQL Server -->
  <path d="M270 570 L270 629" class="ar"/>
  <text x="284" y="607" class="lbl">consultas parametrizadas</text>

  <!-- cilindro SQL Server -->
  <path d="M140 645 L140 695 A130 14 0 0 0 400 695 L400 645" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
  <ellipse cx="270" cy="645" rx="130" ry="14" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
  <text x="270" y="676" text-anchor="middle" class="bt">SQL Server Express</text>
  <text x="270" y="695" text-anchor="middle" class="m">course_tracking</text>

  <!-- Data -> Core -->
  <path d="M700 590 L700 728" class="ar"/>
  <text x="714" y="665" class="lbl">implementa interfaces de Core</text>

  <!-- ============ CORE ============ -->
  <rect x="40" y="730" width="960" height="425" rx="16" class="bandr"/>
  <text x="60" y="758" class="band">Core — dominio y casos de uso (sin MAUI, sin SQL)</text>

  <rect x="60" y="775" width="200" height="160" rx="10" class="box"/>
  <text x="76" y="803" class="bt">Modelos</text>
  <text x="76" y="829" class="m">Student</text>
  <text x="76" y="851" class="m">Section</text>
  <text x="76" y="873" class="l">Asistencia · Entregas</text>
  <text x="76" y="895" class="l">Calendario · Riesgo</text>

  <rect x="275" y="775" width="360" height="160" rx="10" class="box"/>
  <text x="291" y="803" class="mb">RiskRule</text>
  <text x="365" y="803" class="l" font-style="italic">cálculo puro</text>
  <text x="291" y="829" class="l">Entra: asistencias, entregas, totales, umbrales</text>
  <text x="291" y="851" class="l">Sale: puntaje y nivel (Alto, Medio, Bajo)</text>
  <text x="291" y="873" class="l">60 % inasistencia + 40 % entregas faltantes</text>
  <text x="291" y="895" class="l">Umbrales de entrada: 50 y 25</text>
  <text x="291" y="917" class="l">No lee la base</text>

  <rect x="650" y="775" width="330" height="160" rx="10" class="box"/>
  <text x="666" y="803" class="bt">Reglas de calendario</text>
  <text x="666" y="829" class="l">No repetir la fecha de una clase</text>
  <text x="666" y="851" class="l">en la misma comisión</text>
  <text x="666" y="873" class="l">Nombre del trabajo: obligatorio,</text>
  <text x="666" y="895" class="l">se recorta y no pasa de 120 caracteres</text>

  <rect x="60" y="955" width="605" height="180" rx="10" class="box"/>
  <text x="76" y="983" class="bt">Casos de uso</text>
  <text x="76" y="1009" class="l">Seguimiento: alumnos ya evaluados + tarjetas Alto/Medio/Bajo</text>
  <text x="76" y="1031" class="l">contadas sobre esa misma lista</text>
  <text x="76" y="1053" class="l">Calendario · Asistencia · Entregas · Nómina</text>
  <text x="76" y="1075" class="l">Ficha del alumno · Comisiones · Parser e importador CSV</text>
  <text x="76" y="1097" class="l">Registrados como <tspan class="m">transient</tspan> en <tspan class="m">AddCore()</tspan></text>

  <rect x="680" y="955" width="300" height="180" rx="10" class="box"/>
  <text x="696" y="983" class="bt">Interfaces de repositorio</text>
  <text x="696" y="1009" class="l">Contratos definidos en Core</text>
  <text x="696" y="1031" class="l">Implementados por Data</text>
  <text x="696" y="1053" class="l">Los usan los casos de uso</text>
  <text x="696" y="1075" class="l">Sin SQL ni MAUI</text>

  <!-- ============ TESTS ============ -->
  <rect x="1080" y="730" width="320" height="210" rx="14" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
  <text x="1100" y="762" class="band">Tests — <tspan class="mb">xUnit</tspan></text>
  <text x="1100" y="796" class="l">Referencian solo Core</text>
  <text x="1100" y="818" class="l">Usan repositorios falsos</text>
  <text x="1100" y="840" class="l">Métodos <tspan class="m">Given_When_Then</tspan></text>
  <text x="1100" y="862" class="l">Sin referencia a Data ni a UI</text>

  <!-- Tests -> Core -->
  <path d="M1080 905 L1002 905" class="ar"/>
  <text x="1040" y="925" class="lbl" text-anchor="middle"></text>

  <!-- Nota al pie -->
  <text x="40" y="1190" class="note">Los umbrales todavía no se leen de <tspan class="m">dbo.setting</tspan>: otro integrante conecta ese puerto. Las dependencias apuntan hacia Core.</text>
</svg>
