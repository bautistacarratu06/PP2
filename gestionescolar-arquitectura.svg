<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="GestionEscolar — arquitectura">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F766E"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #1F2937; }
      .title { font-size: 26px; font-weight: 700; fill: #134E4A; }
      .band { font-size: 17px; font-weight: 700; fill: #0F766E; }
      .l { font-size: 13.5px; }
      .m { font-family: Consolas, "Courier New", monospace; font-size: 13px; }
      .lbl { font-size: 12px; fill: #0F766E; font-style: italic; }
      .note { font-size: 12px; fill: #6B7280; }
      .bandr { fill: #F0FDFA; stroke: #0F766E; stroke-width: 2; }
      .ar { fill: none; stroke: #0F766E; stroke-width: 2.2; marker-end: url(#arr); }
    </style>
  </defs>

  <rect width="1000" height="640" fill="#FFFFFF"/>
  <text x="40" y="48" class="title">GestionEscolar — arquitectura</text>

  <!-- UI -->
  <rect x="70" y="80" width="620" height="110" rx="16" class="bandr"/>
  <text x="95" y="115" class="band">UI</text>
  <text x="95" y="143" class="l">Proyecto <tspan class="m">UI</tspan> (.NET MAUI, MVVM). Pantallas, ViewModels y composition root.</text>
  <text x="95" y="165" class="l">Presenta datos y delega toda la lógica en Core.</text>

  <!-- Data -->
  <rect x="70" y="250" width="620" height="110" rx="16" class="bandr"/>
  <text x="95" y="285" class="band">Data</text>
  <text x="95" y="313" class="l">Proyecto <tspan class="m">GestionEscolar.Data</tspan> (infraestructura, Entity Framework Core).</text>
  <text x="95" y="335" class="l">Implementa los repositorios definidos en Core.</text>

  <!-- Core -->
  <rect x="70" y="420" width="620" height="110" rx="16" class="bandr"/>
  <text x="95" y="455" class="band">Core</text>
  <text x="95" y="483" class="l">Proyecto <tspan class="m">GestionEscolar.Core</tspan> (dominio y casos de uso).</text>
  <text x="95" y="505" class="l">No conoce MAUI, SQL ni Entity Framework.</text>

  <!-- SQL Server -->
  <path d="M740 275 L740 335 A110 14 0 0 0 960 335 L960 275" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
  <ellipse cx="850" cy="275" rx="110" ry="14" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
  <text x="850" y="312" text-anchor="middle" class="band">SQL Server</text>
  <text x="850" y="332" text-anchor="middle" class="m">course_tracking</text>

  <!-- Tests -->
  <rect x="740" y="420" width="220" height="110" rx="16" class="bandr"/>
  <text x="760" y="455" class="band">Tests</text>
  <text x="760" y="483" class="l">xUnit sobre Core y Data</text>
  <text x="760" y="505" class="l">Nunca sobre la UI</text>

  <!-- Flechas -->
  <path d="M380 190 L380 248" class="ar"/>
  <text x="394" y="224" class="lbl">usa (alta de DI)</text>

  <path d="M380 360 L380 418" class="ar"/>
  <text x="394" y="394" class="lbl">implementa interfaces</text>

  <path d="M70 135 L40 135 L40 475 L68 475" class="ar"/>
  <text x="28" y="305" class="lbl" transform="rotate(-90 28 305)" text-anchor="middle">casos de uso</text>

  <path d="M690 305 L738 305" class="ar"/>

  <path d="M740 475 L692 475" class="ar"/>

  <text x="40" y="600" class="note">Las flechas indican dependencia entre proyectos: todas apuntan hacia Core.</text>
</svg>
